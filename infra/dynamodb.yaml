AWSTemplateFormatVersion: "2010-09-09"
Description: ThermoGuard demo DynamoDB table (matches the console table ThermoGuardEvents).

Parameters:
  TableName:
    Type: String
    Default: ThermoGuardEvents

Resources:
  ThermoGuardEvents:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

Outputs:
  TableName:
    Value: !Ref ThermoGuardEvents
  TableArn:
    Value: !GetAtt ThermoGuardEvents.Arn
